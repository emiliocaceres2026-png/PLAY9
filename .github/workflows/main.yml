name: Ejecutar PLAY9

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

concurrency:
  group: bot-telegram-singleton
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar paquetes del sistema (Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install pyTelegramBotAPI requests

      - name: Ejecutar PLAY9.py
        run: |
          xvfb-run --auto-servernum python PLAY9.py

      # Este paso se ejecuta SIEMPRE (incluso si cancelas el workflow o da error)
      - name: Subir registros y ubicaciones como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registros-bot-telegram
          path: |
            ubicaciones/
            usuarios_seguridad.json
          retention-days: 7
          if-no-files-found: ignore
